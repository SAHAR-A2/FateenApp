name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fateen
          POSTGRES_PASSWORD: fateen
          POSTGRES_DB: fateen
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://fateen:fateen@localhost:5432/fateen
      AGENT_DRY_RUN: "true"
      AGENT_INGEST_API_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Mock tests (no DB)
        run: python -m pytest tests/ -v --tb=short -m "not integration" -q

      - name: Integration tests (real DB)
        run: python -m pytest tests/test_integration.py -v --tb=short -m integration

      - name: Full suite
        run: python -m pytest tests/ -v --tb=short -q
