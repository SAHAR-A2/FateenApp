[project]
name = "fateen-agent"
version = "0.1.0"
description = "Fateen Data Agent — automated, evidence-backed food product data collection and verification."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "tenacity>=8.3",
    "psycopg[binary]>=3.1",
    "rich>=13.7",
]

[project.optional-dependencies]
llm = ["openai>=1.30"]
dev = ["pytest>=8.2", "pytest-cov>=5.0"]

[project.scripts]
fateen-agent = "fateen_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
