name: fateen

description: "Fateen (فطين) - Your companion in the health journey. Premium healthcare app that checks food products against user allergies and chronic diseases."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0

  http: ^1.6.0

  image_picker: ^1.1.2

  mobile_scanner: ^5.2.3

  device_preview: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.jpg
    - assets/products/

  # ─────────────────────────────────────────────────────────────
  # CAIRO FONT — currently OFF. See assets/fonts/README.md for the
  # exact 5-minute steps to download Cairo and turn this on safely.
  # Once you've added the .ttf files below, just remove the "#" from
  # every line in this "fonts:" block (keep the same indentation) and
  # run `flutter pub get`. Nothing else needs to change — app_fonts.dart
  # already points at family: 'Cairo'.
  # ─────────────────────────────────────────────────────────────
  # fonts:
  #   - family: Cairo
  #     fonts:
  #       - asset: assets/fonts/Cairo-Regular.ttf
  #       - asset: assets/fonts/Cairo-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Cairo-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Cairo-Bold.ttf
  #         weight: 700
  #       - asset: assets/fonts/Cairo-ExtraBold.ttf
  #         weight: 800